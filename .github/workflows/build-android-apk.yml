name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install NPM Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Application
        run: npx vite build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew clean assembleDebug --no-daemon --stacktrace --info

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaganVoiceAgent-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Generate Build Summary
        run: |
          echo "### 🇲🇲 ပုဂံ Voice Agent (Android APK) Build ပြီးစီးပါပြီ!" >> $GITHUB_STEP_SUMMARY
          echo "APK ဖိုင်ကို အပေါ်ရှိ **Artifacts** ကဏ္ဍမှ **BaganVoiceAgent-Debug-APK.zip** အနေဖြင့် တိုက်ရိုက် ဒေါင်းလုဒ်လုပ်နိုင်ပါသည်။" >> $GITHUB_STEP_SUMMARY
          echo "- **Application ID:** com.victorgeek.baganvoice" >> $GITHUB_STEP_SUMMARY
          echo "- **App Name:** Bagan Voice Agent" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Mode:** Debug APK" >> $GITHUB_STEP_SUMMARY
      - name: Build Web Application
        run: npx vite build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew clean assembleDebug --no-daemon --stacktrace --info

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaganVoiceAgent-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Generate Build Summary
        run: |
          echo "### 🇲🇲 ပုဂံ Voice Agent (Android APK) Build ပြီးစီးပါပြီ!" >> $GITHUB_STEP_SUMMARY
          echo "APK ဖိုင်ကို အပေါ်ရှိ **Artifacts** ကဏ္ဍမှ **BaganVoiceAgent-Debug-APK.zip** အနေဖြင့် တိုက်ရိုက် ဒေါင်းလုဒ်ဆွဲနိုင်ပါပြီ။" >> $GITHUB_STEP_SUMMARY
          echo "- **Application ID:** com.victorgeek.baganvoice" >> $GITHUB_STEP_SUMMARY
          echo "- **App Name:** Bagan Voice Agent" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Mode:** Debug APK" >> $GITHUB_STEP_SUMMARY
